<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     color="#0f172a" role="img" aria-label="krm">
  <title>krm</title>
  <!--
    Single-color variant for places that strip color: menu bar template icons,
    print, embroidery, engraved surfaces.

    Everything inherits currentColor. The `color` attribute above is only the
    default for standalone viewing — inline this file in HTML, or set `color`
    in CSS, and the whole mark follows. Fill length still encodes severity, so
    it stays readable without hue.
  -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5"
        fill="none" stroke="currentColor" stroke-width="3" opacity="0.35"/>
  <rect x="12" y="17"   width="17" height="7" rx="3.5" fill="currentColor" opacity="0.45"/>
  <rect x="12" y="28.5" width="27" height="7" rx="3.5" fill="currentColor" opacity="0.7"/>
  <rect x="12" y="40"   width="37" height="7" rx="3.5" fill="currentColor"/>
</svg>
