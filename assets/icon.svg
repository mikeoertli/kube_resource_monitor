<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="krm">
  <title>krm</title>
  <!--
    Primary mark: three usage bars at increasing fill, colored with the same
    severity scale the TUI uses (internal/render/color.go). Reads correctly
    down to 16px, which is why this is the favicon and app icon.
  -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>

  <!-- tracks -->
  <rect x="12" y="17"   width="40" height="7" rx="3.5" fill="#1e293b"/>
  <rect x="12" y="28.5" width="40" height="7" rx="3.5" fill="#1e293b"/>
  <rect x="12" y="40"   width="40" height="7" rx="3.5" fill="#1e293b"/>

  <!-- fills: normal / elevated / critical -->
  <rect x="12" y="17"   width="17" height="7" rx="3.5" fill="#22c55e"/>
  <rect x="12" y="28.5" width="27" height="7" rx="3.5" fill="#facc15"/>
  <rect x="12" y="40"   width="37" height="7" rx="3.5" fill="#f87171"/>
</svg>
